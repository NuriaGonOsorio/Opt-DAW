<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
    <form action="/registro" method="post">
        <p><label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"></p>

        <p><label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos"></p>

        <p><label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo"></p>

        <p><label for="contraseña">Contraseña:</label>
        <input type="password" id="contraseña" name="contraseña"></p>

        <p><button type="submit">Enviar</button></p>
    </form>
</body>
</html>
