<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generador de Tablas</title>
</head>
<body>
    <h1>Generador de tablas</h1>
    <form action="/tabla" method="get">
        <label for="filas">Filas (1-20):</label>
            <input type="text" id="filas" name="filas"><br>

        <label for="columnas">Columnas (1-20):</label>
        <input type="text" id="columnas" name="columnas"><br>

        <button type="submit">Generar tabla</button>
    </form>
</body>
</html>
